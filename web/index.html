<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Speech</title>
  <style>
    body, html { width:100%; height:100%; margin:0; background:#202020; color:#eee; font-family: system-ui, sans-serif; }
    #avatar { position:absolute; inset:0 0 140px 0; }
    #controls { position:absolute; left:16px; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; }
    #row { display:flex; gap:8px; flex-wrap:wrap; }
    textarea { width:100%; box-sizing:border-box; height:52px; font-size:15px; padding:8px; }
    select, button { font-size:15px; padding:6px 10px; }
    #subtitles { position:absolute; left:16px; right:16px; bottom:160px; text-align:center; font-size:20px; text-shadow:0 0 4px #000; }
    #loading, #stats { font-size:13px; color:#aaa; }
  </style>
  <script type="importmap">
  { "imports":
    {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "./vendor/TalkingHead/modules/talkinghead.mjs"
    }
  }
  </script>
  <script type="module" src="./speak-client.js"></script>
</head>
<body>
  <div id="avatar"></div>
  <div id="subtitles"></div>
  <div id="controls">
    <textarea id="text">Hello! Your account balance is available in the mobile app. Would you like me to walk you through it?</textarea>
    <div id="row">
      <select id="mode" title="Lip-sync method">
        <option value="rhubarb">PDF Model 2: Kokoro + Rhubarb</option>
        <option value="phoneme" selected>Improved: Kokoro phoneme timings</option>
        <option value="words">Baseline: TalkingHead from words</option>
      </select>
      <select id="voice" title="Voice"></select>
      <button id="speak">Speak</button>
      <button id="stop">Stop</button>
    </div>
    <div id="stats"></div>
    <div id="loading"></div>
  </div>
</body>
</html>
