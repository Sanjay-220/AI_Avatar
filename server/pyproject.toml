[project]
name = "avatar-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs the Kokoro model and Rhubarb binary on disk"]

[tool.ruff]
line-length = 100
